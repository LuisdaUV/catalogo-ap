
name: CI Catalogo MVC

on:
  push:
    branches: ["main", "master", "feature/rediseño-visual"]
  pull_request:
    branches: ["main", "master", "feature/rediseño-visual"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar sintaxis de PHP
        run: |
          find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

    # 3. Validar sintaxis de los archivos PHP en el proyecto MVC
    - name: Verificar sintaxis de PHP
  run: |
    find . -name "*.php" -not -path "./.git/*" -exec php -l {} \;
